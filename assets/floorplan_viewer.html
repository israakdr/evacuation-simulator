<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Floorplan Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-family: Arial;
            border-radius: 5px;
            font-size: 14px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial;
            font-size: 20px;
            color: #333;
        }
    </style>
    <!-- Load Three.js from fast CDN (minified) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">Loading 3D Floorplan...</div>
    <div id="loading">⏳ Loading 3D Viewer...</div>
    
    <script>
        // Remove loading message after scene is ready
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // ============================================
        // 1. Scene Setup
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);
        
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // ============================================
        // 2. Lighting
        // ============================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(500, 1000, 500);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // ============================================
        // 3. Floor
        // ============================================
        const floorGeometry = new THREE.PlaneGeometry(2000, 2000);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0xdddddd,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // ============================================
        // 4. Load Walls from JSON (embedded)
        // ============================================
        const wallsData = WALLS_DATA_PLACEHOLDER;
        
        const WALL_HEIGHT = 100;
        const WALL_THICKNESS = 5;
        
        function createWall(x1, y1, x2, y2, type) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            
            const geometry = new THREE.BoxGeometry(length, WALL_HEIGHT, WALL_THICKNESS);
            
            let color = 0x333333;
            if (type === 'external') {
                color = 0xcc0000;
            } else {
                color = 0x00aa00;
            }
            
            const material = new THREE.MeshStandardMaterial({ color: color });
            const wall = new THREE.Mesh(geometry, material);
            
            wall.position.set(
                (x1 + x2) / 2,
                WALL_HEIGHT / 2,
                (y1 + y2) / 2
            );
            
            wall.rotation.y = -angle;
            wall.castShadow = true;
            wall.receiveShadow = true;
            
            return wall;
        }
        
        if (wallsData && wallsData.walls) {
            wallsData.walls.forEach(wall => {
                const x1 = wall.start.x;
                const y1 = wall.start.y;
                const x2 = wall.end.x;
                const y2 = wall.end.y;
                const type = wall.type;
                
                scene.add(createWall(x1, y1, x2, y2, type));
            });
            
            document.getElementById('info').innerText = 
                `Total Walls: ${wallsData.total_walls} | External: ${wallsData.external_walls} | Internal: ${wallsData.internal_walls}`;
        } else {
            document.getElementById('info').innerText = 'No walls data available';
        }
        
        // ============================================
        // 5. Fit Camera to Scene
        // ============================================
        const box = new THREE.Box3().setFromObject(scene);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        camera.position.set(
            center.x + size.x * 0.8,
            center.y + size.y * 1.5,
            center.z + size.z * 0.8
        );
        controls.target.copy(center);
        controls.update();
        
        // ============================================
        // 6. Animation Loop
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Hide loading message
        hideLoading();
        
        // ============================================
        // 7. Handle Window Resize
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
