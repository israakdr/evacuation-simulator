<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Floorplan Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-family: Arial;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">Loading 3D Floorplan...</div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ============================================
        // 1. Scene Setup
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        camera.position.set(500, 500, 500);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(200, 0, 200);
        
        // ============================================
        // 2. Lighting
        // ============================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1000, 1000, 500);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // ============================================
        // 3. Floor
        // ============================================
        const floorGeometry = new THREE.PlaneGeometry(500, 500);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5f5f5,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(225, 0, 225);
        floor.receiveShadow = true;
        scene.add(floor);
        
        // ============================================
        // 4. Load Walls from JSON
        // ============================================
        const wallsData = WALLS_JSON_PLACEHOLDER;
        const WALL_HEIGHT = 50;
        const WALL_THICKNESS = 5;
        
        function createWall(x1, y1, x2, y2, type) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            
            const geometry = new THREE.BoxGeometry(length, WALL_HEIGHT, WALL_THICKNESS);
            
            const color = type === 'external' ? 0xCC0000 : 0x00AA00;
            const material = new THREE.MeshStandardMaterial({ color: color });
            
            const wall = new THREE.Mesh(geometry, material);
            
            wall.position.set(
                (x1 + x2) / 2,
                WALL_HEIGHT / 2,
                (y1 + y2) / 2
            );
            
            wall.rotation.y = -angle;
            
            wall.castShadow = true;
            wall.receiveShadow = true;
            
            return wall;
        }
        
        // Add all walls from JSON
        let wallCount = 0;
        if (wallsData && wallsData.walls) {
            wallsData.walls.forEach(wall => {
                const x1 = wall.start.x;
                const y1 = wall.start.y;
                const x2 = wall.end.x;
                const y2 = wall.end.y;
                const type = wall.type;
                
                scene.add(createWall(x1, y1, x2, y2, type));
                wallCount++;
            });
        }
        
        // Update info
        document.getElementById('info').innerText = 
            `Building: ${wallsData.building_name} | Walls: ${wallCount}`;
        
        // ============================================
        // 5. Animation Loop
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // ============================================
        // 6. Handle Window Resize
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
